
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03152f"/>
      <stop offset=".5" stop-color="#087cf5"/>
      <stop offset="1" stop-color="#03152f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08b6e8"/>
      <stop offset=".5" stop-color="#436cf5"/>
      <stop offset="1" stop-color="#9050eb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#087cf5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shine">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .circuit{fill:none;stroke:#087cf5;stroke-width:1.4;opacity:.48}
      .node{fill:#08b6e8;filter:url(#shine)}
      .wave1{animation:flow 9s linear infinite}
      .wave2{animation:flow 13s linear infinite reverse}
      .pulse{animation:pulse 2.5s ease-in-out infinite}
      .spin{transform-origin:600px 205px;animation:spin 35s linear infinite}
      @keyframes flow{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="#030712"/>
  <ellipse cx="600" cy="210" rx="550" ry="220" fill="url(#glow)"/>

  <!-- Circuit network -->
  <g class="circuit">
    <path d="M0 65H160L205 110H340L390 160H490"/>
    <path d="M0 110H110L160 160H300L345 205H470"/>
    <path d="M0 355H180L220 315H350L410 265H490"/>
    <path d="M1200 65H1040L995 110H860L810 160H710"/>
    <path d="M1200 110H1090L1040 160H900L855 205H730"/>
    <path d="M1200 355H1020L980 315H850L790 265H710"/>
    <path d="M100 0V65M180 0V80M1020 0V65M1100 0V80"/>
    <path d="M100 420V355M180 420V340M1020 420V355M1100 420V340"/>
  </g>

  <g class="pulse">
    <circle class="node" cx="160" cy="65" r="4"/>
    <circle class="node" cx="340" cy="160" r="4"/>
    <circle class="node" cx="180" cy="355" r="4"/>
    <circle class="node" cx="1040" cy="65" r="4"/>
    <circle class="node" cx="860" cy="160" r="4"/>
    <circle class="node" cx="1020" cy="355" r="4"/>
  </g>

  <!-- Neural network -->
  <g stroke="#08b6e8" stroke-width="1.5" opacity=".5" fill="none">
    <path d="M490 125L545 95L600 125L655 95L710 125"/>
    <path d="M490 285L545 315L600 285L655 315L710 285"/>
    <path d="M545 95L545 315M655 95L655 315M490 125L490 285M710 125L710 285"/>
    <path d="M490 125L600 205L710 125M490 285L600 205L710 285"/>
  </g>
  <g fill="#08b6e8" filter="url(#shine)" class="pulse">
    <circle cx="490" cy="125" r="4"/>
    <circle cx="545" cy="95" r="4"/>
    <circle cx="655" cy="95" r="4"/>
    <circle cx="710" cy="125" r="4"/>
    <circle cx="490" cy="285" r="4"/>
    <circle cx="545" cy="315" r="4"/>
    <circle cx="655" cy="315" r="4"/>
    <circle cx="710" cy="285" r="4"/>
  </g>

  <!-- Ocean-like data waves -->
  <g fill="none" stroke="url(#wave)" stroke-width="3" filter="url(#shine)">
    <path class="wave1" d="M-100 210 C100 100 240 320 420 210 S740 100 920 210 S1120 320 1300 190"/>
    <path class="wave2" d="M-100 235 C100 125 240 345 420 235 S740 125 920 235 S1120 345 1300 215" opacity=".65"/>
    <path class="wave1" d="M-100 185 C100 75 240 295 420 185 S740 75 920 185 S1120 295 1300 165" opacity=".4"/>
  </g>

  <ellipse cx="600" cy="205" rx="165" ry="165" fill="#087cf5" opacity=".16" filter="url(#blur)"/>

  <!-- Rotating orbit -->
  <g class="spin" fill="none" stroke="#08b6e8" opacity=".6">
    <ellipse cx="600" cy="205" rx="145" ry="75" stroke-width="1.5"/>
    <ellipse cx="600" cy="205" rx="155" ry="90" stroke-width="1" stroke-dasharray="5 12"/>
    <circle cx="745" cy="205" r="5" fill="#08b6e8"/>
  </g>

  <!-- Central brand -->
  <circle cx="600" cy="205" r="91" fill="#000000" stroke="#087cf5" stroke-width="3" filter="url(#shine)"/>
  <circle cx="600" cy="205" r="81" fill="none" stroke="#08b6e8" stroke-width="1" opacity=".65"/>
  <text x="600" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="2" fill="#ffffff">WIMBLE</text>

  <text x="600" y="390" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="5" fill="#08b6e8" opacity=".9">INTELLIGENCE • TECHNOLOGY • POSSIBILITY</text>
</svg>
