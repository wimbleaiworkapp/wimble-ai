
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
<defs>
  <radialGradient id="background">
    <stop offset="0%" stop-color="#171824"/>
    <stop offset="100%" stop-color="#000000"/>
  </radialGradient>
  <linearGradient id="spectrum">
    <stop stop-color="#436CF5"/>
    <stop offset=".18" stop-color="#08B6E8"/>
    <stop offset=".36" stop-color="#00B99A"/>
    <stop offset=".52" stop-color="#B4D900"/>
    <stop offset=".68" stop-color="#FFC629"/>
    <stop offset=".82" stop-color="#F052A0"/>
    <stop offset="1" stop-color="#9050EB"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <style>
    .ring {
      fill:none;
      stroke:url(#spectrum);
      stroke-width:1.5;
      opacity:.55;
      transform-origin:600px 310px;
      animation:rotate 18s linear infinite;
    }
    .ring2 {
      animation-direction:reverse;
      animation-duration:25s;
      stroke-dasharray:12 18;
    }
    .particle {
      fill:url(#spectrum);
      filter:url(#glow);
      animation:float 5s ease-in-out infinite alternate;
    }
    .lang {
      fill:white;
      font-size:54px;
      font-family:serif;
      font-weight:bold;
      text-anchor:middle;
      opacity:0;
      filter:url(#glow);
      animation:language 66s infinite;
    }
    @keyframes rotate {
      to {transform:rotate(360deg)}
    }
    @keyframes float {
      to {transform:translateY(-20px);opacity:.3}
    }
    @keyframes language {
      0%,3% {opacity:0}
      4%,12% {opacity:1}
      14%,100% {opacity:0}
    }
    .l1{animation-delay:0s}
    .l2{animation-delay:3s}
    .l3{animation-delay:6s}
    .l4{animation-delay:9s}
    .l5{animation-delay:12s}
    .l6{animation-delay:15s}
    .l7{animation-delay:18s}
    .l8{animation-delay:21s}
    .l9{animation-delay:24s}
    .l10{animation-delay:27s}
    .l11{animation-delay:30s}
    .l12{animation-delay:33s}
    .l13{animation-delay:36s}
    .l14{animation-delay:39s}
    .l15{animation-delay:42s}
    .l16{animation-delay:45s}
    .l17{animation-delay:48s}
    .l18{animation-delay:51s}
    .l19{animation-delay:54s}
    .l20{animation-delay:57s}
    .l21{animation-delay:60s}
    .l22{animation-delay:63s}
  </style>
</defs>

<!-- Black portal -->
<rect width="1200" height="700" fill="url(#background)"/>

<!-- Animated light orbits -->
<ellipse class="ring" cx="600" cy="310" rx="380" ry="180"/>
<ellipse class="ring ring2" cx="600" cy="310" rx="300" ry="230"/>
<ellipse class="ring" cx="600" cy="310" rx="430" ry="260" opacity=".2"/>

<!-- Neon particles -->
<circle class="particle" cx="170" cy="180" r="4"/>
<circle class="particle" cx="1020" cy="170" r="5"/>
<circle class="particle" cx="250" cy="470" r="5"/>
<circle class="particle" cx="950" cy="480" r="4"/>
<circle class="particle" cx="600" cy="100" r="3"/>

<!-- Brand -->
<text x="600" y="230" text-anchor="middle"
      font-family="Georgia,serif" font-size="100"
      font-weight="bold" fill="white"
      letter-spacing="5" filter="url(#glow)">
  WIMBLE
</text>

<text x="600" y="285" text-anchor="middle"
      font-family="Arial,sans-serif"
      font-size="19" letter-spacing="12"
      fill="#BBBBBB">
  WELCOME
</text>

<!-- 22 Indian language greetings -->
<g>
  <text class="lang l1" x="600" y="390">নমস্কাৰ</text>
  <text class="lang l2" x="600" y="390">নমস্কার</text>
  <text class="lang l3" x="600" y="390">नमस्कार</text>
  <text class="lang l4" x="600" y="390">नमस्कार</text>
  <text class="lang l5" x="600" y="390">નમસ્તે</text>
  <text class="lang l6" x="600" y="390">नमस्ते</text>
  <text class="lang l7" x="600" y="390">ನಮಸ್ಕಾರ</text>
  <text class="lang l8" x="600" y="390">آداب</text>
  <text class="lang l9" x="600" y="390">नमस्कार</text>
  <text class="lang l10" x="600" y="390">प्रणाम</text>
  <text class="lang l11" x="600" y="390">നമസ്കാരം</text>
  <text class="lang l12" x="600" y="390">ꯈꯨꯔꯨꯝꯖꯔꯤ</text>
  <text class="lang l13" x="600" y="390">नमस्कार</text>
  <text class="lang l14" x="600" y="390">नमस्कार</text>
  <text class="lang l15" x="600" y="390">ନମସ୍କାର</text>
  <text class="lang l16" x="600" y="390">ਸਤ ਸ੍ਰੀ ਅਕਾਲ</text>
  <text class="lang l17" x="600" y="390">नमस्ते</text>
  <text class="lang l18" x="600" y="390">ᱡᱚᱦᱟᱨ</text>
  <text class="lang l19" x="600" y="390">سلام</text>
  <text class="lang l20" x="600" y="390">வணக்கம்</text>
  <text class="lang l21" x="600" y="390">నమస్కారం</text>
  <text class="lang l22" x="600" y="390">آداب</text>
</g>

<text x="600" y="510" text-anchor="middle"
      fill="#AAAAAA" font-family="Georgia,serif"
      font-size="24" letter-spacing="5">
  WIN YOUR DAY.
</text>

<path d="M350 555 H850" stroke="url(#spectrum)"
      stroke-width="2" opacity=".7">
  <animate attributeName="stroke-dasharray"
           values="0 500;500 0"
           dur="5s" repeatCount="indefinite"/>
</path>

<text x="600" y="620" text-anchor="middle"
      fill="#666666" font-size="15"
      font-family="Arial" letter-spacing="5">
  INTELLIGENCE · SIMPLICITY · OWNERSHIP
</text>
</svg>
